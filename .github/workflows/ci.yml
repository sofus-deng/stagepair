name: StagePair CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.22.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm eval
      - run: pnpm check
      - run: pnpm build
      - name: Preserve generated dependency lock
        uses: actions/upload-artifact@v4
        with:
          name: stagepair-pnpm-lock
          path: pnpm-lock.yaml
          if-no-files-found: error
          retention-days: 1
